name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release for the current version'
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 4-core runner with 16 GB of RAM; the Android plugin does not need more.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true

jobs:
  test:
    # Every push to main: the same local gate, no release assets.
    if: github.ref_type == 'branch' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: tools/install-android-sdk.sh
      - run: ./tools/verify

  apk:
    # Tags publish a GitHub release; a manual dispatch builds the same APK without publishing.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: tools/install-android-sdk.sh
      - name: Resolve version
        id: version
        run: |
          name=$(sed -n 's/^val ensoVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$name" || { echo "::error::cannot read versionName"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
      - name: Tag must match versionName
        if: github.ref_type == 'tag'
        run: |
          test "${{ steps.version.outputs.tag }}" = "$GITHUB_REF_NAME" ||
            { echo "::error::tag $GITHUB_REF_NAME does not match versionName ${{ steps.version.outputs.name }}"; exit 1; }
      - name: Restore the release signing key
        # Every published APK must keep the signing identity of the earlier releases, otherwise an
        # update fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
        env:
          KEYSTORE_B64: ${{ secrets.ENSO_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ENSO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ENSO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ENSO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then
              echo "::error::missing signing secret $secret"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/enso-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
      - name: Build, test and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Assert the APK keeps the release signature
        run: |
          set -euo pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1 || true)
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          name=$(sed -n 's/^val ensoVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          apk=app/build/outputs/apk/release/enso-$name.apk
          test -f "$apk" || { echo "::error::$apk missing"; exit 1; }
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "certificate SHA-256 digest: db9ca8bda33718a667d02ec5385bec6f768dec818d6dfbd00d5428f1ddfbbc88" \
            "$RUNNER_TEMP/certs.txt" ||
            { echo "::error::APK is not signed with the Enso release key"; exit 1; }
      - name: Assert the APK reports the repository version
        run: |
          set -euo pipefail
          name=$(sed -n 's/^val ensoVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1 || true)
          test -n "$aapt2" || { echo "::error::aapt2 not found"; exit 1; }
          "$aapt2" dump badging app/build/outputs/apk/release/enso-$name.apk |
            grep -q "versionName='$name' " ||
            { echo "::error::APK does not report versionName $name"; exit 1; }
      - name: Package release asset and notes
        run: |
          set -euo pipefail
          name=$(sed -n 's/^val ensoVersionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp "app/build/outputs/apk/release/enso-$name.apk" "dist/enso-$name.apk"
          if [ -f "docs/releases/v$name.md" ]; then
            cp "docs/releases/v$name.md" dist/notes.md
          else
            printf 'Enso %s\n' "$name" > dist/notes.md
          fi
          (cd dist && sha256sum "enso-$name.apk" >"enso-$name.apk.sha256")
          cat "dist/enso-$name.apk.sha256"
      - name: Upload preview artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: enso-preview-apk
          path: dist/*
          retention-days: 14
      - name: Publish release
        if: github.ref_type == 'tag' || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: dist/notes.md
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: dist/*
